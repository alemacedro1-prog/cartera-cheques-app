[server]
headless = true
maxUploadSize = 15
maxMessageSize = 20
enableXsrfProtection = true
enableCORS = true

[client]
showErrorDetails = false
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#245A8D"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
borderColor = "#D9E2EC"
blueColor = "#245A8D"
greenColor = "#2E8B70"
orangeColor = "#C48717"
redColor = "#C95651"
dataframeBorderColor = "#D9E2EC"
dataframeHeaderBackgroundColor = "#EDF2F7"

[theme.dark]
primaryColor = "#67B7F7"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C30"
textColor = "#E7EEF8"
borderColor = "#283750"
blueColor = "#67B7F7"
greenColor = "#5DD39E"
orangeColor = "#F8C65A"
redColor = "#FF8B86"
dataframeBorderColor = "#283750"
dataframeHeaderBackgroundColor = "#18263D"

[theme.light.sidebar]
backgroundColor = "#EDF3F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
borderColor = "#D3DEE9"
primaryColor = "#245A8D"

[theme.dark.sidebar]
backgroundColor = "#07101E"
secondaryBackgroundColor = "#111C30"
textColor = "#E7EEF8"
borderColor = "#283750"
primaryColor = "#67B7F7"
